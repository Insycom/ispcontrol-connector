services:
  connector:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    dns:
      - ${ISPCONTROL_DNS_SERVER:-172.31.0.1}
    environment:
      ISPCONTROL_API_URL: ${ISPCONTROL_API_URL}
      ISPCONTROL_ALLOW_INSECURE_HTTP: ${ISPCONTROL_ALLOW_INSECURE_HTTP:-false}
      ISPCONTROL_CONNECTOR_NAME: ${ISPCONTROL_CONNECTOR_NAME:-IspControl Connector}
      ISPCONTROL_ENROLLMENT_TOKEN: ${ISPCONTROL_ENROLLMENT_TOKEN:-}
    volumes:
      - ${ISPCONTROL_DATA_DIR:-ispcontrol-connector-data}:/var/lib/ispcontrol
    ports:
      - "127.0.0.1:9080:9080"
